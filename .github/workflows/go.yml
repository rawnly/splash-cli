name: Go

permissions:
  contents: write
  id-token: write
  attestations: write

on:
  workflow_dispatch:
  pull_request_target:
    branches: [main, develop]
  push:
    branches: [main, develop, feature/*]
    paths-ignore:
      - README.md
      - .github/workflows/go.yml
      - .gitignore
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: go mod download

      - name: Snapshot
        run: mise exec goreleaser -- goreleaser --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          UNSPLASH_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          UNSPLASH_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          LOG_FORMAT: json
          LOG_LEVEL: trace
          ENABLE_SENTRY_DEBUG: false
          DEBUG: true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Snapshot
          path: dist

  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Release
        run: mise run release
        env:
          DEBUG: false
          ENABLE_SENTRY_DEBUG: false
          UNSPLASH_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          UNSPLASH_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Sign release with Packslip
        uses: jdx/packslip@v1
        with:
          artifacts: dist/*.tar.gz dist/*.zip
          bin: splash
